# ==========================================
#  GENERAL SETTINGS
# ==========================================

# Set true color support for aesthetically pleasing colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Change prefix from 'Ctrl+b' to 'Ctrl+a' (easier to reach)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Kill pane without confirmation
bind-key x kill-pane

# Kill window without confirmation
bind-key & kill-window

# Enable mouse support (resizing panes, clicking windows)
set -g mouse on

# Finer mouse-wheel scrolling (1 line per notch instead of a big jump)
bind -T copy-mode-vi WheelUpPane send -N1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N1 -X scroll-down
bind -T copy-mode WheelUpPane send -N1 -X scroll-up
bind -T copy-mode WheelDownPane send -N1 -X scroll-down

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Reduce escape time for snappier Vim responsiveness
set -s escape-time 0

# ==========================================
#  KEYBINDINGS
# ==========================================

# Reload config file with 'Prefix + r'
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Better window splits ('|' for vertical, '-' for horizontal)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-like pane switching (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Move current window left/right (Prefix + < / >), repeatable
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1

# ==========================================
#  AESTHETICS & STATUS BAR
# ==========================================

# Move status bar to the top (looks cleaner and feels modern)
set-option -g status-position top 

# Status bar background and foreground (transparent/default background)
set -g status-style bg=default,fg="#cdd6f4"
set -g status-justify centre
# Left side of status bar: Minimalist session name
set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bold] ➤ #S #[fg=default]  "

# Right side of status bar: Minimalist time and date
set -g status-right-length 40
set -g status-right "#[fg=#a6adc8] %H:%M #[fg=#585b70]•#[fg=#a6adc8] %d %b "

# Window status (Inactive): Just the number and name
set -g window-status-format "#[fg=#585b70] #I #W "

# Window status (Active): Highlighted with a pastel accent color
set -g window-status-current-format "#[fg=#a6e3a1,bold] #I #W #[fg=#a6e3a1]* "

# Pane border styling
set -g pane-border-style fg="#313244"
set -g pane-active-border-style fg="#89b4fa"

# Message styling (Prefix + command prompts)
set -g message-style bg="#313244",fg="#cdd6f4"
